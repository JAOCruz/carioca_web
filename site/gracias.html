<!doctype html>

<head>

<script>try{if(localStorage.getItem('carioca-lang')==='en')document.documentElement.lang='en'}catch(e){}</script>
<style>
  .ty{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px 0}
  .ty__card{max-width:560px;margin:0 auto}
  .ty__icon{width:84px;height:84px;margin:0 auto 28px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 0 0 12px rgba(236,32,37,.15)}

  .ty h1{font-size:clamp(30px,7vw,46px);font-weight:800;color:#fff}
  .ty .lead{margin:18px auto 32px}
  .ty__ctas{display:flex;flex-direction:column;gap:12px;align-items:center}
  .ty__logo{width:140px;margin:0 auto 48px}
  @media (min-width:600px){.ty__ctas{flex-direction:row;justify-content:center}}
</style>
</head>
<body data-keep-title>
<main class="hero ty">
  <div class="hero__bg" aria-hidden="true"></div>

    <div class="ty__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>

      <a class="btn btn--red" href="tel:+18095353864" data-tel><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.6 3.5h-2A1.6 1.6 0 0 0 3 5.2C3.4 13.6 10.4 20.6 18.8 21a1.6 1.6 0 0 0 1.7-1.6v-2a1.6 1.6 0 0 0-1.2-1.6l-3-.8a1.6 1.6 0 0 0-1.6.5l-1 1.2a12.5 12.5 0 0 1-5.4-5.4l1.2-1a1.6 1.6 0 0 0 .5-1.6l-.8-3a1.6 1.6 0 0 0-1.6-1.2z"/></svg>(809) 535-3864</a>

  </div>
